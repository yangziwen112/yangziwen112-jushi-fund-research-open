<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Jushi Fund Research architecture</title>
  <desc id="desc">Data source adapters flow through validation and fallback states into out-of-sample strategy research and risk output.</desc>
  <defs>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="green" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#059669"/><stop offset="1" stop-color="#047857"/></linearGradient>
    <linearGradient id="orange" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".16"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="430" rx="22" fill="#f8fafc"/>
  <text x="54" y="52" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Jushi Fund Research · auditable data and strategy chain</text>
  <text x="54" y="80" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#64748b">The repository separates data quality, source status, strategy validation and risk boundaries.</text>
  <g filter="url(#shadow)">
    <rect x="50" y="145" width="185" height="105" rx="16" fill="url(#blue)"/>
    <text x="142" y="184" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="white">Data adapters</text>
    <text x="142" y="213" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#dbeafe">formal NAV · valuation · fallback</text>
    <rect x="300" y="145" width="190" height="105" rx="16" fill="#334155"/>
    <text x="395" y="184" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="white">Validation</text>
    <text x="395" y="213" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#e2e8f0">date · NAV · duplicate rows</text>
    <rect x="555" y="105" width="210" height="70" rx="16" fill="url(#green)"/>
    <text x="660" y="137" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="white">primary / fallback / cache</text>
    <text x="660" y="159" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">source status is retained</text>
    <rect x="555" y="210" width="210" height="70" rx="16" fill="url(#orange)"/>
    <text x="660" y="242" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="white">insufficient data</text>
    <text x="660" y="264" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fffbeb">stop strategy conclusion</text>
    <rect x="830" y="145" width="165" height="105" rx="16" fill="#7c3aed"/>
    <text x="912" y="184" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="white">Research</text>
    <text x="912" y="213" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#ede9fe">MA20 · 60/40 OOS</text>
    <rect x="1055" y="145" width="100" height="105" rx="16" fill="#0f766e"/>
    <text x="1105" y="184" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="white">Output</text>
    <text x="1105" y="211" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#ccfbf1">metrics</text>
    <text x="1105" y="230" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#ccfbf1">risk</text>
  </g>
  <path d="M235 197 H300" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M490 180 H555" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M490 215 H530 V245 H555" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M765 140 H830" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M765 245 H800 V198 H830" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M995 197 H1055" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="600" y="350" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">No synthetic values · no real-time holding claim · no investment advice</text>
  <text x="600" y="380" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#94a3b8">Public evidence chain replaces unverifiable black-box conclusions.</text>
</svg>
