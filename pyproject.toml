[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jushi-fund-research"
version = "0.1.0"
description = "Auditable fund data policy and out-of-sample research reference implementation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
